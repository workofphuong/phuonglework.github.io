<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14172B">
  <title>Vibe Code Library</title>
  <meta name="description" content="A library of small apps built by describing them to Claude.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="bar">
        <span class="pill" id="eyebrow">Vibe code library</span>
        <span class="owner" id="owner"></span>
      </div>
      <h1 id="title">Vibe code library</h1>
      <p class="script" id="script"></p>
      <p class="intro" id="intro"></p>
    </header>

    <nav class="filters" id="filters" aria-label="Filter projects"></nav>
    <p class="count" id="count" aria-live="polite"></p>
    <main class="cards" id="cards"></main>
    <footer class="foot" id="footer"></footer>
  </div>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="sheet" id="sheet"></div>
  </dialog>

  <noscript><p class="intro">This library needs JavaScript to show the projects.</p></noscript>
  <script src="projects.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
